# Push a tag like v1.1.0 to submit that version to addons.mozilla.org.
# Needs repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET
# (https://addons.mozilla.org/developers/addon/api/key/).
name: Release to AMO

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set manifest version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a version like v1.2.3" >&2
            exit 1
          fi
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            m.version = process.env.VERSION;
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n");
          '
          echo "Version: $VERSION"

      - name: Lint
        run: npx --yes web-ext@8 lint

      - name: Build
        run: npx --yes web-ext@8 build

      - name: Submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # Listed versions go through Mozilla's review; don't wait for it here.
        run: >
          npx --yes web-ext@8 sign
          --channel=listed
          --amo-metadata=amo-metadata.json
          --approval-timeout=0

      - name: Attach package to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" web-ext-artifacts/*.zip --generate-notes
